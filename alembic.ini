# Alembic 配置文件
# 文档：https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# 用法：
#   alembic init alembic                          # 已完成，已生成 alembic/ 目录
#   alembic revision --autogenerate -m "msg"     # 生成迁移（基于 SQLAlchemy 模型 diff）
#   alembic upgrade head                          # 应用迁移到最新
#   alembic downgrade -1                          # 回滚一格
#   alembic history                               # 查看迁移历史
#   alembic current                               # 查看当前版本
#
# 注意：DATABASE_URL 由 alembic/env.py 从环境变量读取，不在此硬编码

[alembic]
# 迁移脚本目录
script_location = %(here)s/alembic

# 文件命名模板：时间戳_唯一ID_消息.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# 时区（影响文件名时间戳）
timezone = Asia/Shanghai

# 默认 false；改为 true 可在 upgrade/downgrade 时自动事务提交
# 这里保持 false，事务由 env.py 控制
revision_environment = false

# 是否在生成的迁移中包含原 SQLAlchemy 模型代码（便于 review）
# 设为 false 减少噪声；如需追溯可改 true
compare_type = true
compare_server_default = true

# 输出 SQL 而非执行（offline 模式）
# 用法：alembic upgrade head --sql
sqlalchemy.url =


# ============================================================
# 日志配置
# ============================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
