# ============================================================
# 安全护栏合规规则（外置配置）
# ============================================================
# 本文件定义 RAG 系统的安全护栏规则，包括：
# 1. 正则规则：快速匹配高危关键词
# 2. LLM 提示词：语义级二次校验
# 3. 分类回复：命中后的标准化拒绝话术
#
# 修改本文件后无需重启服务，SafetyRuleLoader 会在下一次 check_safety 调用时
# 自动检测文件 mtime 变化并热加载。
#
# 修改建议：
# - 新增规则前，先在测试环境验证正则是否误伤正常查询
# - 修改 LLM 提示词后，建议运行回归测试集确认分类准确率
# - 修改回复话术需经法务/合规审核
# ============================================================

version: "1.2.0"
description: "HealthAI 安全护栏合规规则（外置热更新）"

# ============================================================
# 1. 正则规则（快速匹配层）
# ============================================================
# 每条规则包含：
#   name: 规则唯一标识（对应 category_responses 中的键）
#   pattern: 正则表达式（使用双引号包裹避免 YAML 转义问题）
#   flags: 可选，[ignorecase] 或 []
#   reason: 命中原因（日志与返回值使用）
#   enabled: 是否启用，false 时跳过此规则
regex_rules:
  - name: prescription_drug
    pattern: "(?:处方药|开具|开药|处方|帮我开|给我开|降压药|降糖.*?药|胰岛素|二甲双胍|阿司匹林|他汀|抗生素|激素|安眠药|减肥药|泻药|利尿剂|食欲抑制剂|需要吃.*?药|吃什么药|用药|减肥.*?药)"
    flags: [ignorecase]
    reason: "处方药请求：药物开具与调整需由执业医师根据您的具体病情决定，建议您前往医院就诊。"
    enabled: true

  - name: diagnosis_request
    pattern: "(?:帮我诊断|确诊|我是不是得了|我是不是患了|判断.*?什么病|判断.*是不是|是不是糖尿病|是不是高血压|是不是.*癌|检查结果|化验单|体检报告|帮我治疗|治疗方案|头晕|怀孕|帮我看看.*?病)"
    flags: [ignorecase]
    reason: "疾病诊断请求：AI 无法替代医生进行诊断，请携带检查报告前往医院专科就诊。"
    enabled: true

  # 注意：5+2 轻断食、间歇性禁食（IF）是科学减脂方式，应放行
  # 仅拦截：连续多日断食、只喝水、催吐、辟谷、极低热量（<800 kcal/天）等真正危险方式
  # 【阈值统一】正则规则与 LLM prompt 均采用 <800 kcal 作为极低热量判定阈值：
  #   <800 kcal/天 属于 VLCD（极低热量饮食），必须在医生严密监护下进行，普通用户自行执行有严重健康风险
  - name: extreme_diet
    pattern: "(?:辟谷|21天.*不.*吃|7天.*不.*吃|只喝水.*?(?:减肥|不吃|不进食)|催吐|吐出来|极低热量|每天.*?不到.*?[3-7]\\d{2}.*?卡|每天.*?只吃.*?[1-7]\\d{2}.*?卡|过午不食|生酮.*?只吃|只吃肉|只吃水果|导吐|减肥药|泻药.*?减肥|利尿剂.*?减肥|代餐.*?完全替代|想断食.*?[0-9]+天|要断食.*?[0-9]+天|开始断食.*?[0-9]+天|进行.*?[0-9]+天.*?断食|断食.*?[0-9]+天|禁食.*?[0-9]+天|开塞露|每天.*?只吃.*?一个)"
    flags: [ignorecase]
    reason: "极端饮食方式：连续多日断食/极低热量（<800 kcal/天）/催吐等会对身体造成严重伤害，请勿尝试。"
    enabled: true

  - name: special_population_intervention
    pattern: "(?:孕妇.*?[可以能不能].*?吃.*?药|孕妇.*?用药|哺乳期.*?用药|哺乳期.*?[可以能不能].*?吃.*?药|儿童.*?用药|儿童.*?[可以能不能].*?吃.*?药|婴儿.*?减肥|幼儿.*?节食|孕妇.*?断食|孕妇.*?节食|化疗.*?饮食|器官移植.*?吃)"
    flags: [ignorecase]
    reason: "特殊人群：孕妇/哺乳期/儿童的用药与饮食干预必须由专业医师指导，请勿自行处理。"
    enabled: true

# ============================================================
# 2. LLM 语义校验提示词
# ============================================================
# 用于处理正则无法覆盖的隐晦、变体表达
# 修改此提示词会影响 LLM 的分类准确率，建议配套调整风险阈值
llm_prompt: |
  你是一个严格的内容安全审查员，专门审查健康类AI系统中用户的提问。

  判断用户的提问是否属于以下任何一类【危险类别】：

  1. **处方药请求**：要求开具、推荐、调整处方药剂量；询问具体药物用法用量（非保健品）
  2. **疾病诊断请求**：要求 AI 进行疾病确诊、判断是否患有某病、解读检查报告
  3. **极端饮食方式**：询问断食、禁食、极低热量（<800 kcal/天）、催吐、使用减肥药/泻药等
  4. **医疗治疗方案**：要求 AI 制定疾病治疗方案（如"糖尿病治疗方案"、"高血压用药方案"）、替代医生治疗、判断药物副作用处理
  5. **其他医疗违规**：自残倾向、要求替代医生、要求绝对性结论（"我一定不会得XX吧"）

  判断规则（请严格区分）：
  - 询问"XX食物能不能吃/适不适合"是【安全】的（属于饮食咨询）
  - 询问"XX病的饮食原则"是【安全】的（属于科普咨询）
  - 询问"如何治疗XX病"是【危险】的（属于治疗方案）
  - 询问"我需要吃XX药吗"是【危险】的（属于处方药）
  - 询问"帮我确诊/我是不是得了XX"是【危险】的（属于诊断请求）
  - 【安全】"帮我制定减肥计划/减脂计划/健身计划/饮食计划"——这是健康生活咨询，不是医疗行为
  - 【安全】"减肥方案/增肌方案/体重管理"——这是健身与营养规划，不是疾病治疗
  - 【安全】"XX病患者应该怎么吃"——这是饮食科普，不是诊断或治疗
  - 【危险】"帮我制定糖尿病治疗方案/高血压治疗方案"——这是针对疾病的治疗方案
  - 🆕 【安全】"5+2轻断食/间歇性禁食/IF/Time-Restricted Eating（限时进食）怎么进行"——这是科学减脂方式，2016年起已有多篇临床研究证实安全性，成人可执行
  - 🆕 【安全】"轻断食的方法/注意事项/食谱"——科学轻断食方案（5+2、16:8、隔天交替等）属于健康饮食咨询
  - 🆕 只有用户明确说"连续XX天完全不吃/只喝水/催吐/辟谷"才是【危险】极端饮食

  危险类别补充定义：
  - extreme_diet 仅用于：连续≥3天完全断食、每日<800 kcal极低热量、催吐/导吐、减肥药/泻药滥用、孕妇/病人自行断食
  - 科学轻断食（5+2、16:8、隔天交替禁食）不属于 extreme_diet！

  输出格式（严格JSON，不要包含```json标记）：
  {
    "is_dangerous": true/false,
    "category": "prescription_drug|diagnosis_request|extreme_diet|treatment_plan|other|none", # 危险类别
    "reason": "判断理由（中文，简短一句话）",
    "suggestion": "对用户的安全引导建议（中文）"
  }

# ============================================================
# 3. 分类标准化回复
# ============================================================
# 命中拦截后返回给用户的标准化拒绝话术
# 修改回复话术需经法务/合规审核
category_responses:
  prescription_drug:
    reply: "关于药物的开具、调整或停用，必须由执业医师根据您的具体病情和检查结果决定，AI 无法也不应替代医生进行药物相关决策。"
    suggestion: "建议您携带相关检查报告前往正规医院对应专科就诊，由医生评估后给出用药方案。"

  diagnosis_request:
    reply: "疾病的诊断需要结合病史、体格检查、实验室检查和影像学检查综合判断，AI 无法替代医生进行诊断。"
    suggestion: "建议您前往医院就诊，医生会根据您的具体情况安排必要的检查并给出诊断。"

  extreme_diet:
    reply: "断食、极低热量饮食、催吐等极端方式会对身体造成严重伤害，包括肌肉流失、代谢损伤、电解质紊乱、内分泌失调等，请勿尝试。"
    suggestion: "健康减重建议每周减 0.5-1kg，每日热量缺口 300-500 kcal 即可。我可以为您生成科学的饮食计划。"

  treatment_plan:
    reply: "疾病治疗方案的制定属于医疗行为，必须由主治医师根据您的病情制定，AI 无法替代医生进行治疗决策。"
    suggestion: "建议您前往医院专科就诊，同时我可以为您提供疾病相关的饮食调理建议。"

  other:
    reply: "您的问题涉及医疗专业判断，超出 AI 饮食健康助手的咨询范围。"
    suggestion: "建议您咨询专业医生或医疗机构。"

  none:
    reply: ""
    suggestion: ""

# ============================================================
# 4. 全局开关
# ============================================================
# 紧急情况下可临时关闭安全护栏（仅限测试环境，生产环境不建议关闭）
global_enabled: true
