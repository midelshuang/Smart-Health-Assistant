[pytest]
# Test file location and naming convention
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options
# - coverage：统计 src/ 覆盖率，输出 term-missing + xml（供 CI 上传）
# - coverage 阈值：先设 40%，避免首次启用就卡死历史代码；后续逐步提升至 80%
# - 默认跳过 slow/perf 标记的测试（手动跑：pytest --no-cov -m slow）
addopts =
    -v --tb=short --strict-markers --color=yes
    --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml
    --cov-fail-under=40
    -m "not slow and not perf"

# Markers declaration
markers =
    slow: slow tests (e.g. real LLM calls)
    unit: pure function/logic unit tests (no external dependencies)
    integration: integration tests requiring external services
    e2e: end-to-end API flow tests
    perf: performance/load tests (Locust)
    redis: tests requiring Redis service
    db: tests requiring database

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Minimum version
minversion = 7.0

# Filter deprecation warnings
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:google.*
