name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 同分支串行，避免重复跑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      chroma:
        image: chromadb/chroma:latest
        ports: ['8001:8000']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthai_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-test-secret-not-for-prod-9f3a2c1b8e7d
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://localhost
      LLM_MODEL: test-model
      EMBEDDING_API_KEY: test-key
      EMBEDDING_BASE_URL: http://localhost
      EMBEDDING_MODEL: test-embed
      CHROMA_HOST: localhost
      CHROMA_PORT: 8001
      APP_ENV: test
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install ruff mypy pip-audit

      # R06：ruff 改为必须通过（阻断级规则见 ruff.toml：语法错误/未定义名）
      # 完整风格治理另行专项开展，暂不把 UP/I/B/RUF 等纳入阻断
      - name: Ruff lint
        run: ruff check src tests

      # R06：审计目标改为 requirements.txt（钉版依赖本身），移除假占位 ignore
      # 注意：ecdsa(PYSEC-2026-1325) 上游暂无修复版本，升级依赖前无法阻断，
      # 故保留 continue-on-error；依赖升级专项完成后移除该行
      - name: pip-audit security scan
        run: pip-audit -r requirements.txt --strict --desc off
        continue-on-error: true

      # R06：schema 初始化失败必须让流水线失败
      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d healthai_test -f database/init.sql

      - name: Wait for ChromaDB
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v2/heartbeat >/dev/null \
               || curl -sf http://localhost:8001/api/v1/heartbeat >/dev/null; then
              echo "ChromaDB ready"; exit 0
            fi
            sleep 2
          done
          echo "ChromaDB not ready after 60s"; exit 1

      - name: Run tests with coverage
        env:
          PYTEST_MARKERS: "not slow and not perf"
        run: |
          pytest \
            --ignore=tests/e2e \
            --ignore=tests/perf \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=30 \
            -m "${PYTEST_MARKERS}"
        # 当前实际覆盖率 31%，门槛从 30% 起步，随测试补充逐步上调（40% → 50%）
        # e2e/perf 需要完整真实服务栈（API 服务、真实 LLM、已入库数据），仅在本地/nightly 跑
        # 首次启用：阈值设为 40%，避免直接卡 80% 阻断流水线；后续逐步提升

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          retention-days: 14

      # R06：Docker 镜像必须能构建（原 Dockerfile 的 site-packages COPY 路径错误）
      - name: Docker build check
        run: docker build -t healthai:ci-${{ github.sha }} .
